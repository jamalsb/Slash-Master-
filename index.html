<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Slash Master</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1025;font-family:sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0}
.hud{position:fixed;color:#fff;text-shadow:2px 2px 4px #000;font-weight:bold;pointer-events:none}
#score{top:10px;left:12px;font-size:26px}
#lives{top:44px;left:12px;font-size:20px}
#level{top:74px;left:12px;font-size:16px;color:#9fd}
#best{top:10px;right:12px;font-size:16px;color:#ffd700}
.btn{position:fixed;right:12px;width:44px;height:44px;border:none;border-radius:10px;background:rgba(255,255,255,.15);color:#fff;font-size:20px;cursor:pointer}
#pauseBtn{top:40px}
#muteBtn{top:90px}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.72);color:#fff;text-align:center;padding:20px}
.ov.on{display:flex}
h1{font-size:44px;color:#ff5588;margin:0 0 10px}
p{font-size:18px;margin:6px 0;color:#ddd}
button.play{font-size:26px;padding:12px 40px;margin-top:16px;border:none;border-radius:12px;background:#ff5588;color:#fff;cursor:pointer}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="hud" id="score">Score: 0</div>
<div class="hud" id="lives"></div>
<div class="hud" id="level"></div>
<div class="hud" id="best"></div>
<button class="btn" id="pauseBtn" onclick="togglePause()">⏸</button>
<button class="btn" id="muteBtn" onclick="toggleMute()">🔊</button>

<div class="ov on" id="start">
  <h1>🍉 Slash Master 🔪</h1>
  <p>فروٹ کاٹیں، 💣 سے بچیں، ⭐ سے بونس لیں</p>
  <p>انگلی یا ماؤس سے سوائپ کریں</p>
  <button class="play" onclick="startGame()">PLAY</button>
</div>

<div class="ov" id="pause">
  <h1>⏸ Paused</h1>
  <button class="play" onclick="togglePause()">RESUME</button>
</div>

<div class="ov" id="over">
  <h1>Game Over</h1>
  <p id="final"></p>
  <p id="newBest"></p>
  <button class="play" onclick="startGame()">RETRY</button>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,R;
function fit(){
  W=cv.width=innerWidth;
  H=cv.height=innerHeight;
  R=Math.max(30,Math.min(46,Math.min(W,H)*0.07));
}
fit();
addEventListener('resize',fit);

const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const show=(id,on)=>$(id).classList.toggle('on',!!on);

/* ================= SOUND (fully procedural, no files) ================= */
let ac=null,master=null,noiseBuf=null,muted=false;

function initAudio(){
  if(!ac){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();
    master.gain.value=0.7;
    master.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*0.6,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(ac.state==='suspended')ac.resume();
}

function tone(f1,f2,dur,type,vol,delay=0){
  if(!ac||muted)return;
  const s=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;
  o.frequency.setValueAtTime(f1,s);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+dur);
  g.gain.setValueAtTime(0.0001,s);
  g.gain.exponentialRampToValueAtTime(vol,s+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
  o.connect(g);g.connect(master);
  o.start(s);o.stop(s+dur+0.05);
}

function noise(dur,filterType,f1,f2,vol,delay=0){
  if(!ac||muted)return;
  const s=ac.currentTime+delay;
  const src=ac.createBufferSource();
  src.buffer=noiseBuf;
  const fl=ac.createBiquadFilter();
  fl.type=filterType;
  fl.Q.value=1;
  fl.frequency.setValueAtTime(f1,s);
  if(f2)fl.frequency.exponentialRampToValueAtTime(f2,s+dur);
  const g=ac.createGain();
  g.gain.setValueAtTime(vol,s);
  g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
  src.connect(fl);fl.connect(g);g.connect(master);
  src.start(s,Math.random()*0.3);
  src.stop(s+dur+0.05);
}

const SFX={
  swoosh(){noise(0.2,'bandpass',600,2800,0.45)},
  splat(){noise(0.2,'lowpass',1800,300,0.7);tone(220,60,0.18,'sine',0.5)},
  bomb(){tone(140,30,0.6,'sawtooth',0.3);noise(0.7,'lowpass',500,80,0.8)},
  miss(){tone(330,120,0.35,'sine',0.25)},
  gold(){[880,1175,1480,1760].forEach((f,i)=>tone(f,f,0.18,'triangle',0.25,i*0.06))},
  combo(){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.15,'square',0.08,i*0.05))},
  over(){[392,330,262,196].forEach((f,i)=>tone(f,f*0.98,0.35,'triangle',0.3,i*0.25))},
  start(){tone(400,800,0.2,'triangle',0.2)},
  pause(){tone(600,600,0.08,'sine',0.2)}
};

function toggleMute(){
  muted=!muted;
  $('muteBtn').textContent=muted?'🔇':'🔊';
}

/* ================= GAME DATA ================= */
const FRUITS=[
  {e:'🍎',c:'#e74c3c'},{

<!DOCTYPE html>
<html lang="ur">
<head>
     <meta name="google-site-verification" content="nsl2yt2vZH2W3va55wAgg6p17hhnAZ2IVvuFwY5MZTk" />
     <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5619905086772247"
     crossorigin="anonymous"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Slash Master</title>
     <meta name="description" content="Slash Master ek free online browser game hai. Bina download kiye khelein, apni speed test karein aur high score banayein. Abhi play karein!">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1025;font-family:sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;position:fixed;inset:0}
.hud{position:fixed;color:#fff;text-shadow:2px 2px 4px #000;font-weight:bold;pointer-events:none}
#score{top:10px;left:12px;font-size:26px}
#lives{top:44px;left:12px;font-size:20px}
#level{top:74px;left:12px;font-size:16px;color:#9fd}
#best{top:10px;right:12px;font-size:16px;color:#ffd700}
.btn{position:fixed;right:12px;width:44px;height:44px;border:none;border-radius:10px;background:rgba(255,255,255,.15);color:#fff;font-size:20px;cursor:pointer}
#pauseBtn{top:40px}
#muteBtn{top:90px}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.72);color:#fff;text-align:center;padding:20px}
.ov.on{display:flex}
h1{font-size:44px;color:#ff5588;margin:0 0 10px}
p{font-size:18px;margin:6px 0;color:#ddd}
button.play{font-size:26px;padding:12px 40px;margin-top:16px;border:none;border-radius:12px;background:#ff5588;color:#fff;cursor:pointer}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="hud" id="score">Score: 0</div>
<div class="hud" id="lives"></div>
<div class="hud" id="level"></div>
<div class="hud" id="best"></div>
<button class="btn" id="pauseBtn" onclick="togglePause()">⏸</button>
<button class="btn" id="muteBtn" onclick="toggleMute()">🔊</button>

<div class="ov on" id="start">
  <h1>🍉 Slash Master 🔪</h1>
  <p>فروٹ کاٹیں، 💣 سے بچیں، ⭐ سے بونس لیں</p>
  <p>انگلی یا ماؤس سے سوائپ کریں</p>
  <button class="play" onclick="startGame()">PLAY</button>
</div>

<div class="ov" id="pause">
  <h1>⏸ Paused</h1>
  <button class="play" onclick="togglePause()">RESUME</button>
</div>

<div class="ov" id="over">
  <h1>Game Over</h1>
  <p id="final"></p>
  <p id="newBest"></p>
  <button class="play" onclick="startGame()">RETRY</button>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,R;
function fit(){
  W=cv.width=innerWidth;
  H=cv.height=innerHeight;
  R=Math.max(30,Math.min(46,Math.min(W,H)*0.07));
}
fit();
addEventListener('resize',fit);

const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const show=(id,on)=>$(id).classList.toggle('on',!!on);

/* ================= SOUND (fully procedural, no files) ================= */
let ac=null,master=null,noiseBuf=null,muted=false;

function initAudio(){
  if(!ac){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();
    master.gain.value=0.7;
    master.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*0.6,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(ac.state==='suspended')ac.resume();
}

function tone(f1,f2,dur,type,vol,delay=0){
  if(!ac||muted)return;
  const s=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;
  o.frequency.setValueAtTime(f1,s);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+dur);
  g.gain.setValueAtTime(0.0001,s);
  g.gain.exponentialRampToValueAtTime(vol,s+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
  o.connect(g);g.connect(master);
  o.start(s);o.stop(s+dur+0.05);
}

function noise(dur,filterType,f1,f2,vol,delay=0){
  if(!ac||muted)return;
  const s=ac.currentTime+delay;
  const src=ac.createBufferSource();
  src.buffer=noiseBuf;
  const fl=ac.createBiquadFilter();
  fl.type=filterType;
  fl.Q.value=1;
  fl.frequency.setValueAtTime(f1,s);
  if(f2)fl.frequency.exponentialRampToValueAtTime(f2,s+dur);
  const g=ac.createGain();
  g.gain.setValueAtTime(vol,s);
  g.gain.exponentialRampToValueAtTime(0.0001,s+dur);
  src.connect(fl);fl.connect(g);g.connect(master);
  src.start(s,Math.random()*0.3);
  src.stop(s+dur+0.05);
}

const SFX={
  swoosh(){noise(0.2,'bandpass',600,2800,0.45)},
  splat(){noise(0.2,'lowpass',1800,300,0.7);tone(220,60,0.18,'sine',0.5)},
  bomb(){tone(140,30,0.6,'sawtooth',0.3);noise(0.7,'lowpass',500,80,0.8)},
  miss(){tone(330,120,0.35,'sine',0.25)},
  gold(){[880,1175,1480,1760].forEach((f,i)=>tone(f,f,0.18,'triangle',0.25,i*0.06))},
  combo(){[523,659,784,1047].forEach((f,i)=>tone(f,f,0.15,'square',0.08,i*0.05))},
  over(){[392,330,262,196].forEach((f,i)=>tone(f,f*0.98,0.35,'triangle',0.3,i*0.25))},
  start(){tone(400,800,0.2,'triangle',0.2)},
  pause(){tone(600,600,0.08,'sine',0.2)}
};

function toggleMute(){
  muted=!muted;
  $('muteBtn').textContent=muted?'🔇':'🔊';
}

/* ================= GAME DATA ================= */
const FRUITS=[
  {e:'🍎',c:'#e74c3c'},{e:'🍊',c:'#f39c12'},{e:'🍋',c:'#f1c40f'},
  {e:'🍉',c:'#e84377'},{e:'🍇',c:'#8e44ad'},{e:'🍓',c:'#e53935'},
  {e:'🥝',c:'#7cb342'},{e:'🍍',c:'#fbc02d'}
];
const G=0.2;

function loadBest(){try{return +localStorage.getItem('slashBest')||0}catch(e){return 0}}
function saveBest(v){try{localStorage.setItem('slashBest',v)}catch(e){}}

let state='menu';
let fruits=[],parts=[],floats=[],trail=[];
let score=0,lives=3,streak=0,best=loadBest();
let spawnT=0,shake=0,flash=0,flashColor='255,0,40',comboMsg='',comboT=0;
let down=false,last=null,strokeCuts=0,lastSwoosh=0,lastT=0;

const level=()=>1+Math.floor(score/15);

function nextSpawn(){return Math.max(0.5,1.6-level()*0.07)*rnd(0.7,1.3);}

function spawn(){
  const roll=Math.random();
  const type=roll<0.07?'bomb':roll<0.13?'gold':'fruit';
  const f=FRUITS[Math.random()*FRUITS.length|0];
  const sp=Math.min(1.2,1+(level()-1)*0.04);
  fruits.push({
    type,
    e:type==='bomb'?'💣':type==='gold'?'⭐':f.e,
    c:type==='gold'?'#ffd700':f.c,
    x:rnd(W*0.15,W*0.85),
    y:H+R,
    vx:rnd(-1.2,1.2),
    vy:-rnd(9.5,11)*sp,
    rot:0,
    vr:rnd(-0.06,0.06),
    r:R,
    cut:false,
    gone:false
  });
}

function juice(x,y,c,n){
  for(let i=0;i<n;i++){
    parts.push({x,y,vx:rnd(-7,7),vy:rnd(-11,-2),life:1,s:rnd(4,10),c});
  }
}

function addFloat(x,y,t,c){floats.push({x,y,t,c,life:1});}

function comboText(t){comboMsg=t;comboT=1;}

function updateHUD(){
  $('score').textContent='Score: '+score;
  $('lives').textContent='❤'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives));
  $('level').textContent='Level '+level();
  $('best').textContent='Best: '+best;
}

/* ================= GAME FLOW ================= */
function startGame(){
  initAudio();
  score=0;lives=3;streak=0;
  fruits=[];parts=[];floats=[];trail=[];
  spawnT=1;shake=0;flash=0;comboT=0;
  down=false;last=null;
  state='play';
  show('start',0);show('over',0);show('pause',0);
  $('pauseBtn').textContent='⏸';
  SFX.start();
  updateHUD();
}

function togglePause(){
  if(state==='play'){
    state='pause';
    show('pause',1);
    SFX.pause();
  }else if(state==='pause'){
    state='play';
    show('pause',0);
  }
  $('pauseBtn').textContent=state==='pause'?'▶':'⏸';
}

function gameOver(){
  if(state!=='play')return;
  state='over';
  down=false;
  SFX.over();
  const isNew=score>best&&score>0;
  if(isNew){best=score;saveBest(best);}
  $('final').textContent='Score: '+score;
  $('newBest').textContent=isNew?'🏆 نیا ریکارڈ!':'';
  show('over',1);
  updateHUD();
}

function missFruit(){
  SFX.miss();
  lives--;
  streak=0;
  flash=0.6;flashColor='255,0,40';
  shake=10;
  updateHUD();
  if(lives<=0)gameOver();
}

function explode(f){
  SFX.bomb();
  shake=18;
  flash=0.7;flashColor='255,140,0';
  streak=0;
  juice(f.x,f.y,'#666',20);
  lives--;
  comboText('BOOM! 💣');
  updateHUD();
  if(lives<=0)gameOver();
}

function cutFruit(f){
  f.cut=true;
  if(f.type==='bomb'){explode(f);return;}

  strokeCuts++;
  streak++;
  const mult=Math.min(5,1+Math.floor(streak/5));
  const pts=(f.type==='gold'?5:1)*mult;
  score+=pts;

  if(f.type==='gold'){
    juice(f.x,f.y,f.c,30);
    SFX.gold();
    addFloat(f.x,f.y,'+'+pts+' ⭐','#ffd700');
    shake=4;
  }else{
    juice(f.x,f.y,f.c,18);
    SFX.splat();
    addFloat(f.x,f.y,'+'+pts,'#ffffff');
  }

  if(strokeCuts===2)comboText('DOUBLE SLICE! 🔥');
  if(strokeCuts===3)comboText('TRIPLE SLICE! 💥');
  if(streak>0&&streak%5===0){
    comboText('COMBO x'+mult+'! 🔥');
    SFX.combo();
  }
  updateHUD();
}

/* ================= SLICING ================= */
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay;
  const L=dx*dx+dy*dy;
  let t=L?((px-ax)*dx+(py-ay)*dy)/L:0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}

function slice(a,b){
  for(const f of fruits){
    if(state!=='play')break;
    if(f.cut||f.gone)continue;
    if(segDist(f.x,f.y,a.x,a.y,b.x,b.y)<f.r*0.9){
      cutFruit(f);
    }
  }
}

/* ================= INPUT ================= */
const pt=e=>({x:e.clientX,y:e.clientY});

addEventListener('pointerdown',e=>{
  if(state!=='play'||e.target!==cv)return;
  down=true;
  last=pt(e);
  trail=[last];
  strokeCuts=0;
});

addEventListener('pointermove',e=>{
  if(!down||state!=='play'||!last)return;
  const p=pt(e);
  const d=Math.hypot(p.x-last.x,p.y-last.y);
  if(d>0)slice(last,p);
  if(d>25&&performance.now()-lastSwoosh>140){
    SFX.swoosh();
    lastSwoosh=performance.now();
  }
  trail.push(p);
  if(trail.length>12)trail.shift();
  last=p;
});

const endStroke=()=>{down=false;last=null;trail=[];strokeCuts=0;};
addEventListener('pointerup',endStroke);
addEventListener('pointercancel',endStroke);

addEventListener('keydown',e=>{
  if(e.key==='p'||e.key==='P'||e.key==='Escape')togglePause();
});

/* ================= UPDATE ================= */
function update(dt){
  if(state==='play'){
    spawnT-=dt/60;
    if(spawnT<=0){
      spawn();
      spawnT=nextSpawn();
    }
    for(const f of fruits){
      f.x+=f.vx*dt;
      f.y+=f.vy*dt;
      f.vy+=G*dt;
      f.rot+=f.vr*dt;
      if(!f.cut&&!f.gone&&f.vy>0&&f.y>H+R*2){
        f.gone=true;
        if(f.type==='fruit')missFruit();
      }
    }
    fruits=fruits.filter(f=>!f.cut&&!f.gone);
  }

  for(const p of parts){
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=0.35*dt;
    p.life-=0.025*dt;
  }
  parts=parts.filter(p=>p.life>0);

  for(const t of floats){
    t.y-=1.2*dt;
    t.life-=0.02*dt;
  }
  floats=floats.filter(t=>t.life>0);

  if(comboT>0)comboT-=0.012*dt;
  if(shake>0)shake*=Math.pow(0.88,dt);
  if(shake<0.2)shake=0;
  if(flash>0)flash-=0.04*dt;
}

/* ================= DRAW ================= */
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  const g=ctx.createRadialGradient(W/2,H*0.4,50,W/2,H/2,Math.max(W,H));
  g.addColorStop(0,'#2d1b46');
  g.addColorStop(1,'#120a1c');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));

  for(const f of fruits){
    ctx.save();
    ctx.translate(f.x,f.y);
    ctx.rotate(f.rot);
    if(f.type==='gold'){ctx.shadowColor='#ffd700';ctx.shadowBlur=24;}
    ctx.font=`${f.r*2}px serif`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(f.e,0,0);
    ctx.restore();
  }

  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.c;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.s*(0.5+p.life/2),0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  ctx.textAlign='center';
  ctx.font='bold 24px sans-serif';
  for(const t of floats){
    ctx.globalAlpha=Math.max(0,t.life);
    ctx.fillStyle=t.c;
    ctx.fillText(t.t,t.x,t.y);
  }
  ctx.globalAlpha=1;

  if(trail.length>1){
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.shadowColor='#8ff';
    ctx.shadowBlur=14;
    for(let i=1;i<trail.length;i++){
      const k=i/trail.length;
      ctx.strokeStyle=`rgba(180,255,255,${k})`;
      ctx.lineWidth=2+k*8;
      ctx.beginPath();
      ctx.moveTo(trail[i-1].x,trail[i-1].y);
      ctx.lineTo(trail[i].x,trail[i].y);
      ctx.stroke();
    }
    ctx.shadowBlur=0;
  }
  ctx.restore();

  if(comboT>0){
    ctx.globalAlpha=Math.min(1,comboT);
    ctx.fillStyle='#ffd700';
    ctx.font='bold 36px sans-serif';
    ctx.textAlign='center';
    ctx.shadowColor='#000';
    ctx.shadowBlur=6;
    ctx.fillText(comboMsg,W/2,H*0.18);
    ctx.shadowBlur=0;
    ctx.globalAlpha=1;
  }

  if(flash>0){
    ctx.fillStyle=`rgba(${flashColor},${flash*0.35})`;
    ctx.fillRect(0,0,W,H);
  }
}

/* ================= LOOP ================= */
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(3,Math.max(0.2,(t-lastT)/16.67));
  lastT=t;
  if(state!=='pause')update(dt);
  draw();
}

updateHUD();
requestAnimationFrame(loop);
</script>
</body>
</html>
